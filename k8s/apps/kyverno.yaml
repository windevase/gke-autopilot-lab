# Kyverno 정책 엔진 (Audit 전용, 평일 10~20시) — values k8s/kyverno/values.yaml (CRD 는 수동, 머리말 참고)
# replicas 는 오프아워 Job 이 정함 → Argo 는 replicas 무시. 정책은 별도 앱 kyverno-policies
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.10.0 # app v1.20.0
      helm:
        releaseName: kyverno
        skipCrds: true
        valueFiles:
          - $values/k8s/kyverno/values.yaml
    - repoURL: git@github.com:windevase/gcp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true # 큰 ClusterRole·ConfigMap — client-side apply 주석 크기 제한 회피
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
