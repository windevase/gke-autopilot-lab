# Grafana 대시보드 ConfigMap (생성기 → JSON → ConfigMap, Grafana 사이드카가 반영)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:windevase/gcp.git
    targetRevision: main
    path: k8s/monitoring/dashboards
    directory:
      include: '*.configmap.yaml' # 생성기(.py)·원본 JSON은 제외, ConfigMap만
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true } # Git = 원본. 클러스터에서 직접 바꾼 내용은 되돌려짐
    syncOptions:
      - RespectIgnoreDifferences=true
