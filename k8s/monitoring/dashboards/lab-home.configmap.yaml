    == 1))[7d:10m]) / 2^30 * $mem_rate) * 730\",\n          \"legendFormat\": \"\",\n
    \         \"refId\": \"A\",\n          \"range\": false,\n          \"instant\":
    true\n        }\n      ],\n      \"id\": 6\n    },\n    {\n      \"type\": \"stat\",\n
