    = FORMAT_TIMESTAMP('%Y%m', CURRENT_TIMESTAMP(), 'America/Los_Angeles')\",\n          \"rawQuery\":
    true,\n          \"editorMode\": \"code\",\n          \"format\": 1,\n          \"location\":
    \"US\"\n        }\n      ],\n      \"id\": 5\n    },\n    {\n      \"type\": \"stat\",\n
    \     \"title\": \"추정 월 비용 (USD)\",\n      \"datasource\": {\n        \"type\":
