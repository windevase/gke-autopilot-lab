    \"none\",\n        \"textMode\": \"value\",\n        \"justifyMode\": \"center\"\n
    \     },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\":
    \"grafana-bigquery-datasource\",\n            \"uid\": \"bigquery-billing\"\n
    \         },\n          \"refId\": \"A\",\n          \"rawSql\": \"SELECT IFNULL(ROUND(SAFE_DIVIDE(SUM(cost
