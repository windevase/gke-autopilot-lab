    \     },\n      \"options\": {\n        \"mode\": \"markdown\",\n        \"content\":
    \"### GKE Autopilot 모니터링 랩\\n월 **$10 크레딧 안에서** 운영하는 GKE Autopilot(Spot Pod) +
    kube-prometheus-stack 실습 환경입니다.\\nTerraform(GCP·Cloudflare·AWS) · Helm · Cloudflare
    Tunnel · 예산 초과 자동 차단 · GitHub Actions CI · Argo CD · **Atlantis(채팅 승인 terraform
    CI/CD)**\\n\\n| 대시보드 | 내용 |\\n|---|---|\\n| [\U0001F4B0 실제 청구액](/d/lab-billing)
    | BigQuery 결제 데이터: 사용액·크레딧·월말 예상, 추정 vs 실제 |\\n| [\U0001F4CA 비용 & 용량](/d/lab-cost-capacity)
    | 파드 requests 기반 비용 추정, rightsizing |\\n| [⚙️ 클러스터 성능](/d/lab-cluster-performance)
    | 노드·워크로드·PV·API 서버·Prometheus |\\n| [\U0001F6E0️ 운영 & 외부 접속](/d/lab-ops) | 가동
    타임라인, CronJob, Spot 노드 교체, Cloudflare Tunnel |\\n| [\U0001F680 Argo CD (GitOps)](/d/lab-argocd)
    | 앱 Sync/Health, 동기화 이력·소요 시간, 컨트롤러 캐시, Git, 리소스 |\\n| [\U0001F510 OpenBao (임시
    자격 발급)](/d/lab-openbao) | 역할 없는 서버·담당자 로그인, AWS STS 발급, 살아 있는 자격, 감사 (필요할 때만 가동)
    |\\n| [\U0001F3AF SLO (lab-api 에러 버짓)](/d/lab-slo) | 가용성·지연 SLO, 다중 창 소진 속도, canary
    배포 파드 템플릿별 비교 |\\n| [\U0001F6E1️ Kyverno 정책 결과](/d/lab-kyverno) | 정책별 통과·위반, 위반
    목록, 검사 범위 (CI 차단 + 클러스터 Audit) |\\n| [\U0001F3D7️ Terraform CI/CD](/d/lab-github)
    | Atlantis 실시간(plan·apply·가동 시간) + PR·Actions·사후/교차 감사·정책 위반 이력 |\\n| [\U0001F419
    GitHub 사용량](/d/lab-github-usage) | GitHub Free 무료 한도 대비 Actions 분·저장 공간·청구 예정·API
    한도 |\\n\"\n      },\n      \"id\": 1\n    },\n    {\n      \"type\": \"row\",\n
