    [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\":
    false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\":
    \"none\",\n        \"textMode\": \"value\",\n        \"justifyMode\": \"center\"\n
    \     },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\":
    \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\":
    \"(avg_over_time(sum(max by (namespace,pod,container) (kube_pod_container_resource_requests{resource=\\\"cpu\\\",namespace!~\\\"kube-system|gke-.*\\\"})
