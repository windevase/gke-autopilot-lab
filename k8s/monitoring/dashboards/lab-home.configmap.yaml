    \"stat\",\n      \"title\": \"순 청구액\",\n      \"datasource\": {\n        \"type\":
    \"grafana-bigquery-datasource\",\n        \"uid\": \"bigquery-billing\"\n      },\n
    \     \"description\": \"크레딧 차감 후 실제 결제될 금액 (결제 데이터는 1~2일 지연)\",\n      \"gridPos\":
    {\n        \"h\": 4,\n        \"w\": 5,\n        \"x\": 0,\n        \"y\": 13\n
    \     },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\":
    \"currencyKRW\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n
    \           \"steps\": [\n              {\n                \"color\": \"green\",\n
    \               \"value\": null\n              },\n              {\n                \"color\":
    \"orange\",\n                \"value\": 1\n              },\n              {\n
    \               \"color\": \"red\",\n                \"value\": 5000\n              }\n
    \           ]\n          },\n          \"color\": {\n            \"mode\": \"thresholds\"\n
    \         },\n          \"decimals\": 0\n        },\n        \"overrides\": []\n
    \     },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\":
    [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\":
    false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\":
    \"none\",\n        \"textMode\": \"value\",\n        \"justifyMode\": \"center\"\n
    \     },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\":
    \"grafana-bigquery-datasource\",\n            \"uid\": \"bigquery-billing\"\n
    \         },\n          \"refId\": \"A\",\n          \"rawSql\": \"SELECT IFNULL(ROUND(SUM(cost)
    + SUM(IFNULL((SELECT SUM(c.amount) FROM UNNEST(credits) c), 0))), 0) AS value
    FROM `billing_export.gcp_billing_export_v1_*` WHERE invoice.month = FORMAT_TIMESTAMP('%Y%m',
    CURRENT_TIMESTAMP(), 'America/Los_Angeles')\",\n          \"rawQuery\": true,\n
    \         \"editorMode\": \"code\",\n          \"format\": 1,\n          \"location\":
    \"US\"\n        }\n      ],\n      \"id\": 3\n    },\n    {\n      \"type\": \"gauge\",\n
    \     \"title\": \"예산 대비 (₩$budget_krw)\",\n      \"datasource\": {\n        \"type\":
    \"grafana-bigquery-datasource\",\n        \"uid\": \"bigquery-billing\"\n      },\n
    \     \"description\": \"100%면 budget-guard가 워크로드를 자동으로 0으로 내림\",\n      \"gridPos\":
    {\n        \"h\": 4,\n        \"w\": 5,\n        \"x\": 5,\n        \"y\": 13\n
    \     },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\":
    \"percentunit\",\n          \"min\": 0,\n          \"max\": 1,\n          \"thresholds\":
    {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n
    \               \"color\": \"green\",\n                \"value\": null\n              },\n
    \             {\n                \"color\": \"orange\",\n                \"value\":
    0.5\n              },\n              {\n                \"color\": \"red\",\n
    \               \"value\": 0.9\n              }\n            ]\n          },\n
    \         \"color\": {\n            \"mode\": \"thresholds\"\n          }\n        },\n
    \       \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\":
    {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\":
    \"\",\n          \"values\": false\n        },\n        \"showThresholdMarkers\":
    true\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n
    \           \"type\": \"grafana-bigquery-datasource\",\n            \"uid\": \"bigquery-billing\"\n
    \         },\n          \"refId\": \"A\",\n          \"rawSql\": \"SELECT IFNULL(SAFE_DIVIDE(SUM(cost)
    + SUM(IFNULL((SELECT SUM(c.amount) FROM UNNEST(credits) c WHERE c.type = 'FREE_TIER'),
    0)), $budget_krw), 0) AS value FROM `billing_export.gcp_billing_export_v1_*` WHERE
    invoice.month = FORMAT_TIMESTAMP('%Y%m', CURRENT_TIMESTAMP(), 'America/Los_Angeles')\",\n
    \         \"rawQuery\": true,\n          \"editorMode\": \"code\",\n          \"format\":
    1,\n          \"location\": \"US\"\n        }\n      ],\n      \"id\": 4\n    },\n
    \   {\n      \"type\": \"stat\",\n      \"title\": \"월말 예상 (할인 전, USD)\",\n      \"datasource\":
    {\n        \"type\": \"grafana-bigquery-datasource\",\n        \"uid\": \"bigquery-billing\"\n
    \     },\n      \"description\": \"크레딧 차감 전 전체 사용액의 월 환산. $10 크레딧과 비교\",\n      \"gridPos\":
    {\n        \"h\": 4,\n        \"w\": 5,\n        \"x\": 10,\n        \"y\": 13\n
    \     },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\":
    \"currencyUSD\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n
    \           \"steps\": [\n              {\n                \"color\": \"green\",\n
