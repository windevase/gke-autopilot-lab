    \"orange\",\n                \"value\": 7\n              },\n              {\n
    \               \"color\": \"red\",\n                \"value\": 10\n              }\n
    \           ]\n          },\n          \"color\": {\n            \"mode\": \"thresholds\"\n
    \         },\n          \"decimals\": 2\n        },\n        \"overrides\": []\n
    \     },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\":
    [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\":
