apiVersion: v1
data:
  lab-cost-capacity.json: |
    {
      "uid": "lab-cost-capacity",
      "title": "Lab · 비용 & 용량 (Autopilot Spot)",
      "description": "GKE Autopilot은 파드 requests 기준 과금. 시스템 네임스페이스(kube-system, gke-*)는 과금 제외. 단가는 대시보드 변수(cpu_rate/mem_rate/pd_rate)로 관리.",
      "tags": [
        "lab",
        "cost",
        "autopilot"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "5m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace (과금 대상)",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "ns"
            },
            "regex": "/^(?!kube-system$|gke-).*/",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "cpu_rate",
            "label": "Spot vCPU $/h",
            "type": "constant",
            "query": "0.0133",
            "hide": 2
          },
          {
            "name": "mem_rate",
            "label": "Spot GiB $/h",
            "type": "constant",
            "query": "0.0014767",
            "hide": 2
          },
          {
            "name": "pd_rate",
            "label": "pd-standard $/GiB-month",
            "type": "constant",
            "query": "0.04",
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "요약",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "panels": []
        },
        {
          "type": "stat",
          "id": 1,
          "title": "예상 월 비용 (USD)",
          "description": "A: 최근 7일 동안 실제 Running 파드 requests의 평균 (야간 정지 반영) / B: 현재 Running 파드가 24시간 내내 켜져 있다고 가정한 상한값 (오프아워 정지 미반영 → 실제보다 높음). 파드 requests·PV만 포함하고 네트워크·관리형 서비스 비용은 제외. 단가는 대시보드 변수 cpu_rate/mem_rate/pd_rate.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "최근 7일 실가동",
              "expr": "(avg_over_time(sum(max by (namespace,pod,container) (kube_pod_container_resource_requests{resource=\"cpu\",namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}) * on(namespace,pod) group_left() max by (namespace,pod) (kube_pod_status_phase{phase=\"Running\"} == 1))[7d:10m]) * $cpu_rate + avg_over_time(sum(max by (namespace,pod,container) (kube_pod_container_resource_requests{resource=\"memory\",namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}) * on(namespace,pod) group_left() max by (namespace,pod) (kube_pod_status_phase{phase=\"Running\"} == 1))[7d:10m]) / 2^30 * $mem_rate) * 730 + (sum(max by (namespace,persistentvolumeclaim) (kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"})) or vector(0)) / 2^30 * $pd_rate",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "legendFormat": "24시간 가정 (상한)",
              "expr": "(sum(max by (namespace,pod,container) (kube_pod_container_resource_requests{resource=\"cpu\",namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}) * on(namespace,pod) group_left() max by (namespace,pod) (kube_pod_status_phase{phase=\"Running\"} == 1)) * $cpu_rate + sum(max by (namespace,pod,container) (kube_pod_container_resource_requests{resource=\"memory\",namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}) * on(namespace,pod) group_left() max by (namespace,pod) (kube_pod_status_phase{phase=\"Running\"} == 1)) / 2^30 * $mem_rate) * 730 + (sum(max by (namespace,persistentvolumeclaim) (kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"})) or vector(0)) / 2^30 * $pd_rate",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 8
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "textMode": "value_and_name",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "id": 2,
          "title": "CPU requests (과금)",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 4,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(max by (namespace,pod,container) (kube_pod_container_resource_requests{resource=\"cpu\",namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}) * on(namespace,pod) group_left() max by (namespace,pod) (kube_pod_status_phase{phase=\"Running\"} == 1))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 3,
              "displayName": "vCPU"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "메모리 requests (과금)",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 7,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(max by (namespace,pod,container) (kube_pod_container_resource_requests{resource=\"memory\",namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}) * on(namespace,pod) group_left() max by (namespace,pod) (kube_pod_status_phase{phase=\"Running\"} == 1))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none"
          }
        },
        {
          "type": "gauge",
          "id": 4,
          "title": "CPU 사용률 (사용/요청)",
          "description": "낮을수록 requests 과다 = 돈 낭비. Spot 과금은 requests 기준.",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 10,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\",container!=\"\",container!=\"POD\"}[5m])) / sum(max by (namespace,pod,container) (kube_pod_container_resource_requests{resource=\"cpu\",namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}) * on(namespace,pod) group_left() max by (namespace,pod) (kube_pod_status_phase{phase=\"Running\"} == 1))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "orange",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.3
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "gauge",
          "id": 5,
          "title": "메모리 사용률 (사용/요청)",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 13,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\",container!=\"\",container!=\"POD\"}) / sum(max by (namespace,pod,container) (kube_pod_container_resource_requests{resource=\"memory\",namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}) * on(namespace,pod) group_left() max by (namespace,pod) (kube_pod_status_phase{phase=\"Running\"} == 1))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "orange",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.4
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "id": 6,
          "title": "활성 시계열",
          "description": "Prometheus 메모리 사용량과 직결",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 16,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(prometheus_tsdb_head_series)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 150000
                  },
                  {
                    "color": "red",
                    "value": 250000
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "stat",
          "id": 7,
          "title": "재시작 (1h)",
          "gridPos": {
            "h": 4,
            "w": 2,
            "x": 19,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(max by (namespace,pod,container) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}[1h]))) or vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "id": 8,
          "title": "OOMKilled (24h)",
          "description": "24시간 안에 OOMKilled로 종료된 컨테이너 수 (KSM 종료 사유 기준, 파드 교체 후에도 집계)",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(max by (namespace,pod,container) (max_over_time(kube_pod_container_status_last_terminated_reason{reason=\"OOMKilled\",namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}[24h])) == 1) or vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "type": "row",
          "title": "컨테이너별 여유 (rightsizing)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 101,
          "panels": []
        },
        {
          "type": "bargauge",
          "id": 9,
          "title": "메모리 사용 / limit",
          "description": "90% 이상이면 OOM 위험 → limit/request 상향. 낮으면 축소 후보.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{container}}",
              "instant": true,
              "expr": "sort_desc(max by (namespace,pod,container) (container_memory_working_set_bytes{namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\",container!=\"\",container!=\"POD\"}) / on(namespace,pod,container) max by (namespace,pod,container) (kube_pod_container_resource_limits{resource=\"memory\",namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.75
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "valueMode": "text",
            "namePlacement": "left"
          }
        },
        {
          "type": "bargauge",
          "id": 10,
          "title": "CPU 사용 / request (5m)",
          "description": "Autopilot은 requests 기준 과금 → 지속적으로 낮으면 requests 축소 후보 (단, 메모리:CPU 비율 6.5GiB/vCPU 상한 주의)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{container}}",
              "instant": true,
              "expr": "sort_desc(sum by (namespace,pod,container) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\",container!=\"\",container!=\"POD\"}[5m])) / on(namespace,pod,container) max by (namespace,pod,container) (kube_pod_container_resource_requests{resource=\"cpu\",namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.2
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "valueMode": "text",
            "namePlacement": "left"
          }
        },
        {
          "type": "timeseries",
          "id": 11,
          "title": "메모리: 사용량 vs 요청 (파드별)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{pod}}",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\",container!=\"\",container!=\"POD\"})"
            },
            {
              "refId": "B",
              "legendFormat": "{{pod}} 요청",
              "expr": "sum by (pod) (max by (namespace,pod,container) (kube_pod_container_resource_requests{resource=\"memory\",namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}) * on(namespace,pod) group_left() max by (namespace,pod) (kube_pod_status_phase{phase=\"Running\"} == 1))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*요청$"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 12,
          "title": "CPU: 사용량 vs 요청 (파드별)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{pod}}",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\",container!=\"\",container!=\"POD\"}[5m]))"
            },
            {
              "refId": "B",
              "legendFormat": "{{pod}} 요청",
              "expr": "sum by (pod) (max by (namespace,pod,container) (kube_pod_container_resource_requests{resource=\"cpu\",namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}) * on(namespace,pod) group_left() max by (namespace,pod) (kube_pod_status_phase{phase=\"Running\"} == 1))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 3,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*요청$"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "title": "Prometheus 상태",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "id": 102,
          "panels": []
        },
        {
          "type": "bargauge",
          "id": 13,
          "title": "수집 job별 시계열 수",
          "description": "카디널리티 큰 job부터 metricRelabelings로 drop 검토",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 23
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{job}}",
              "instant": true,
              "expr": "sort_desc(sum by (job) (scrape_samples_post_metric_relabeling))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "continuous-BlYlRd"
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "timeseries",
          "id": 14,
          "title": "활성 시계열 & 수집 속도",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 23
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "활성 시계열",
              "expr": "max(prometheus_tsdb_head_series)"
            },
            {
              "refId": "B",
              "legendFormat": "samples/s",
              "expr": "max(rate(prometheus_tsdb_head_samples_appended_total[5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "samples/s"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "stat",
          "id": 15,
          "title": "수집 대상 정상",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 23
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up) / count(up)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.9
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "type": "gauge",
          "id": 16,
          "title": "TSDB 디스크 (PV)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 23
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(kubelet_volume_stats_used_bytes{namespace=\"monitoring\",persistentvolumeclaim=~\"prometheus-.*\"} / kubelet_volume_stats_capacity_bytes{namespace=\"monitoring\",persistentvolumeclaim=~\"prometheus-.*\"})",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "timeseries",
          "id": 17,
          "title": "재시작 (파드별, 1h 증가량)",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 27
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{pod}}",
              "expr": "sum by (namespace,pod) (max by (namespace,pod,container) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\",namespace!~\"kube-system|gke-.*\"}[1h]))) > 0"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: grafana-dashboard-lab-cost-capacity
  namespace: monitoring
