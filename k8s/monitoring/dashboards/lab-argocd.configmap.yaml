apiVersion: v1
data:
  lab-argocd.json: |
    {
      "uid": "lab-argocd",
      "title": "Lab · Argo CD (GitOps)",
      "description": "App of Apps 상태, 동기화 이력·소요 시간, 컨트롤러 캐시·reconcile, Git·repo-server, 리소스",
      "tags": [
        "lab",
        "gitops",
        "argocd"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "개요 — Argo CD는 평일 10~20시만 가동",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1
        },
        {
          "type": "stat",
          "title": "관리 앱",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "App of Apps(root) + 컴포넌트별 앱",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "noValue": "꺼짐 (오프아워)"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (name) (argocd_app_info))",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "id": 2
        },
        {
          "type": "stat",
          "title": "Synced",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Git과 클러스터가 일치하는 앱 수",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (name) (argocd_app_info{sync_status=\"Synced\"})) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "id": 3
        },
        {
          "type": "stat",
          "title": "Healthy",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "리소스 상태가 정상인 앱 수",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (name) (argocd_app_info{health_status=\"Healthy\"})) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "id": 4
        },
        {
          "type": "stat",
          "title": "비정상 앱",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "OutOfSync이거나 Healthy가 아닌 앱 수",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "없음",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "noValue": "꺼짐 (오프아워)"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (name) (argocd_app_info{sync_status!=\"Synced\"}) or max by (name) (argocd_app_info{health_status!=\"Healthy\"})) or (count(max by (name) (argocd_app_info)) * 0)",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "id": 5
        },
        {
          "type": "stat",
          "title": "동기화 (24h)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Git push 후 자동 동기화 + 수동 동기화 횟수",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(argocd_app_sync_total[24h])) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "id": 6
        },
        {
          "type": "stat",
          "title": "동기화 실패 (24h)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(argocd_app_sync_total{phase=~\"Failed|Error\"}[24h])) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "id": 7
        },
        {
          "type": "stat",
          "title": "클러스터 연결",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "in-cluster 연결 (감시 범위: argocd, monitoring 네임스페이스 + 클러스터 범위 리소스)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "정상",
                      "color": "green",
                      "index": 0
                    },
                    "0": {
                      "text": "끊김",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ],
              "noValue": "꺼짐 (오프아워)"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(argocd_cluster_connection_status)",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "id": 8
        },
        {
          "type": "row",
          "title": "앱 상태",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 9
        },
        {
          "type": "table",
          "title": "앱별 현재 상태",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "gridPos": {
            "h": 9,
            "w": 9,
            "x": 0,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "동기화"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "Synced": {
                            "text": "Synced",
                            "color": "green",
                            "index": 0
                          },
                          "OutOfSync": {
                            "text": "OutOfSync",
                            "color": "orange",
                            "index": 1
                          },
                          "Unknown": {
                            "text": "Unknown",
                            "color": "red",
                            "index": 2
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "상태"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "Healthy": {
                            "text": "Healthy",
                            "color": "green",
                            "index": 0
                          },
                          "Progressing": {
                            "text": "Progressing",
                            "color": "blue",
                            "index": 1
                          },
                          "Degraded": {
                            "text": "Degraded",
                            "color": "red",
                            "index": 2
                          },
                          "Missing": {
                            "text": "Missing",
                            "color": "orange",
                            "index": 3
                          },
                          "Suspended": {
                            "text": "Suspended",
                            "color": "gray",
                            "index": 4
                          },
                          "Unknown": {
                            "text": "Unknown",
                            "color": "red",
                            "index": 5
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "앱",
                "desc": false
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (name, sync_status, health_status) (argocd_app_info)",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "Value": true
                },
                "renameByName": {
                  "name": "앱",
                  "sync_status": "동기화",
                  "health_status": "상태"
                }
              }
            }
          ],
          "id": 10
        },
        {
          "type": "state-timeline",
          "title": "앱별 정상 여부 (Synced + Healthy)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "빈 구간 = Argo CD가 꺼진 오프아워 (상태 판단 안 함)",
          "gridPos": {
            "h": 9,
            "w": 15,
            "x": 9,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "정상",
                      "color": "green",
                      "index": 0
                    },
                    "0": {
                      "text": "비정상",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "fillOpacity": 80,
                "lineWidth": 0
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "rowHeight": 0.8,
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (name) (argocd_app_info{sync_status=\"Synced\", health_status=\"Healthy\"}) or (max by (name) (argocd_app_info) * 0)",
              "legendFormat": "{{name}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ],
          "id": 11
        },
        {
          "type": "row",
          "title": "동기화",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "id": 12
        },
        {
          "type": "timeseries",
          "title": "앱별 동기화 횟수 (1시간 단위)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 80,
                "showPoints": "never",
                "spanNulls": 900000,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0,
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (name) (increase(argocd_app_sync_total[1h]))",
              "legendFormat": "{{name}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ],
          "id": 13
        },
        {
          "type": "timeseries",
          "title": "동기화 결과 (1시간 단위)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Failed/Error가 보이면 앱별 현재 상태 확인",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 80,
                "showPoints": "never",
                "spanNulls": 900000,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0,
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (phase) (increase(argocd_app_sync_total[1h]))",
              "legendFormat": "{{phase}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ],
          "id": 14
        },
        {
          "type": "timeseries",
          "title": "평균 동기화 소요 시간 (앱별, 1시간)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "kps(Helm 차트 렌더링 + Server-Side Apply)가 가장 오래 걸림",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": 900000,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (name) (increase(argocd_app_sync_duration_seconds_total[1h])) / sum by (name) (increase(argocd_app_sync_total[1h]))",
