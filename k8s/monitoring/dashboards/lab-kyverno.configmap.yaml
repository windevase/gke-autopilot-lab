  lab-kyverno.json: |
    {
      "uid": "lab-kyverno",
      "title": "Lab · Kyverno 정책 결과",
      "description": "Kyverno 정책 보고서(Audit) — 정책별 통과·위반, 위반 목록, 검사 범위. 데이터: KSM customResourceState(PolicyReport)",
      "tags": [
        "lab",
        "kyverno",
        "policy"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "5m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "text",
          "title": "",
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "**정책 = 코드** (`k8s/kyverno/policies/`): ephemeral-storage 요청 필수(비용) · 이미지 digest/버전 고정 · restricted 보안 설정 · Spot 노드(비용) · lab-api 이미지 cosign 서명.\n**PR 단계**에서 CI(Kyverno CLI)가 매니페스트·차트 렌더링 결과를 검사해 위반이면 merge 차단 → **클러스터**에서는 Audit 모드로 실행 중인 리소스를 다시 검사해 정책 보고서로 남긴다(차단 없음).\nKyverno 는 평일 10~20시만 가동 — 그 밖의 시간에는 마지막 스캔 결과를 보여 준다."
          },
          "id": 1
        },
        {
          "type": "row",
          "title": "요약 (클러스터 정책 보고서)",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "id": 2
        },
