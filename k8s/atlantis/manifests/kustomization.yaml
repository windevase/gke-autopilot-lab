# Atlantis 부속 리소스 (Argo CD 가 kustomize 로 렌더링)
# 외부 진입은 monitoring 네임스페이스의 공용 터널 lab-grafana (k8s/monitoring/cloudflared) — 전용 터널은 2026-11-13 합침
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atlantis
resources:
  - networkpolicy.yaml
generatorOptions:
  disableNameSuffixHash: true # 차트 values 가 고정 이름으로 참조
configMapGenerator:
  # 감시 스크립트 — 서버 측에 두어 PR 이 수정해 우회할 수 없게 함
  # plan-guard.sh 원본은 infra-terraform/.github/scripts/plan-guard.sh (변경 시 함께 갱신)
  - name: atlantis-guard
    files:
      - guard/plan-guard.sh
      - guard/atlantis-guard.sh
      # plan 첫 단계 사전 검사 — 원본 infra-terraform/.github/scripts/tf-precheck.sh (내용 동일)
      - guard/tf-precheck.sh
  # 프로필 이름 = 프로젝트명. 내용만 웹 아이덴티티 역할로 (로컬 PC 의 같은 프로필은 사용자 자격 증명)
  - name: atlantis-aws-config
    files:
      - aws/config
      - aws/config-plan # plan 단계 전용(읽기 역할) — workflow plan 단계 env AWS_CONFIG_FILE
