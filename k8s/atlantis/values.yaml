# Atlantis 차트 values (runatlantis/atlantis 6.16.2, app v0.48.2)
# 대상: github.com/windevase/infra-terraform (C:\infra\terraform) — 프로젝트 test = 개인 AWS 테스트 계정(111122223333)
#
# 흐름: PR → 웹훅(Cloudflare 공용 터널 lab-grafana, atlantis.example.com/events만) → autoplan + 감시 보고 댓글
#       → 담당자 PR 승인 → `atlantis apply -p test` 댓글 → apply 직전 감시 재검사 → apply
#
# AWS 인증: 액세스 키 없음. KSA atlantis 의 projected 토큰(audience sts.amazonaws.com)을
#   AWS 가 GKE 클러스터 OIDC 발급자로 직접 신뢰 (IRSA 방식). 역할·OIDC provider 는 infra-terraform/_bootstrap.
#   프로필 이름 = 프로젝트명(test) 규칙 유지 → provider/backend 코드 변경 없음 (manifests/aws/config)
#
# 대상 2: github.com/windevase/gcp (이 저장소) platform/ 계층 — 2026-11-14 추가 (랩 전체 GitOps: k8s=Argo CD, 클라우드=Atlantis)
#   GCP 인증: KSA atlantis 의 Workload Identity(직접 principal) — 권한은 루트 module.atlantis_access(IAM 조건으로 범위 제한)
#
# 수동으로 만드는 Secret (atlantis 네임스페이스, 출력·커밋 금지):
#   atlantis-vcs                    github_secret(웹훅 secret), key.pem(GitHub App 개인키)
#   atlantis-guard-github           token (감시용 fine-grained PAT: infra-terraform·gcp 읽기 전용 — Actions·Contents·Issues·Pull requests, 계정 Plan 읽기)
#   atlantis-gcp-platform           backend.hcl, terraform.tfvars(platform/), cloudflare_token — gcp-platform workflow 에서만 사용

orgAllowlist: github.com/windevase/infra-terraform,github.com/windevase/gcp
atlantisUrl: https://atlantis.example.com

# GitHub App (봇 이름으로 댓글·상태). id/slug 는 App 생성 후 입력 — 비밀 아님
githubApp:
  id: "5730280" # 반드시 문자열 — 숫자면 Helm 이 float 로 바꿔 "5.73028e+06" 으로 렌더링(Atlantis 기동 실패)
  slug: windevase-atlantis # https://github.com/settings/apps/windevase-atlantis (infra-terraform·gcp 에 설치)
vcsSecretName: atlantis-vcs

defaultTFVersion: 1.17.1 # infra-terraform required_version >= 1.17.0
hidePrevPlanComments: true
enableDiffMarkdownFormat: true
disableApplyAll: true # 프로젝트를 지정한 apply 만 (`atlantis apply -p test`)
allowForkPRs: false

# 서버 측 정책 — 저장소(atlantis.yaml)가 덮어쓸 수 없음
repoConfig: |
  # Prometheus 지표 (/metrics, 4141) — monitoring 의 Prometheus 만 접근(manifests/networkpolicy.yaml). 외부(Cloudflare)는 /events 만
  metrics:
    prometheus:
      endpoint: /metrics
  repos:
    - id: github.com/windevase/infra-terraform
      branch: /^main$/
      apply_requirements: [approved, mergeable, undiverged]
      import_requirements: [approved, mergeable, undiverged]
      workflow: guarded
      allowed_overrides: []
      allow_custom_workflows: false
      delete_source_branch_on_merge: false
      repo_locking: true
    - id: github.com/windevase/gcp
      branch: /^main$/
      apply_requirements: [approved, mergeable, undiverged]
      import_requirements: [approved, mergeable, undiverged]
      workflow: gcp-platform
      allowed_overrides: []
      allow_custom_workflows: false
      delete_source_branch_on_merge: false
      repo_locking: true
  workflows:
    # plan 은 승인 전에 실행된다(autoplan) → ① 사전 검사(tf-precheck: provisioner·external/http·허용 밖 provider·원격 module·
    #   파일 함수 절대 경로 차단)로 init·plan 자체를 막고 ② init 은 lock 파일에 없는 provider 를 받지 않으며(-lockfile=readonly)
    #   ③ AWS 는 plan 전용 읽기 역할(aws/config-plan)로. apply 단계는 기본 aws/config(쓰기 역할)
    guarded:
      plan:
        steps:
          - env:
              name: AWS_CONFIG_FILE
              value: /etc/aws/config-plan
          - run: bash /opt/guard/tf-precheck.sh
          - init:
              extra_args: ["-input=false", "-lockfile=readonly"]
          - run: bash /opt/guard/atlantis-guard.sh fmt
          - plan:
              extra_args: ["-lock-timeout=5m"]
          - run: bash /opt/guard/atlantis-guard.sh plan
      apply:
        steps:
          - run: bash /opt/guard/atlantis-guard.sh apply
          - apply:
              extra_args: ["-lock-timeout=5m"]
    # gcp 저장소 platform/ — backend·변수·Cloudflare 토큰은 Secret(/etc/gcp-platform)에서만, 이 workflow 안에서만 env 로
    # apply 직전 감시가 확인할 CI 는 gcp 저장소의 'ci' 워크플로
    gcp-platform:
      plan:
        steps:
          - env:
              name: CLOUDFLARE_API_TOKEN
              command: cat /etc/gcp-platform/cloudflare_token
          - env:
              name: GUARD_REQUIRED_WORKFLOW
              value: ci
          - run: bash /opt/guard/tf-precheck.sh
          - init:
              extra_args: ["-input=false", "-lockfile=readonly", "-backend-config=/etc/gcp-platform/backend.hcl"]
          - run: bash /opt/guard/atlantis-guard.sh fmt
          - plan:
              extra_args: ["-lock-timeout=5m", "-var-file=/etc/gcp-platform/terraform.tfvars"]
          - run: bash /opt/guard/atlantis-guard.sh plan
      apply:
        steps:
          - env:
              name: CLOUDFLARE_API_TOKEN
              command: cat /etc/gcp-platform/cloudflare_token
          - env:
              name: GUARD_REQUIRED_WORKFLOW
              value: ci
          - run: bash /opt/guard/atlantis-guard.sh apply
          - apply:
              extra_args: ["-lock-timeout=5m"]

# 평소 꺼둠. 켜기/끄기: tools/atlantis.ps1 (Argo 는 replicas 무시)
replicaCount: 0

service:
  type: ClusterIP
ingress:
  enabled: false # 외부 진입은 monitoring 네임스페이스 cloudflared(공용 터널)만
test:
  enabled: false # helm test 용 bats Pod 불필요
# Prometheus 수집 (kube-prometheus-stack 이 모든 네임스페이스의 ServiceMonitor 를 읽음). Atlantis 지표만 keep
# 평소 replicas 0 이라 켜 둔 동안의 이벤트만 쌓인다 — 장기 이력은 Grafana GitHub 데이터소스(PR·Actions 기록)로 본다
servicemonitor:
  enabled: true
  interval: 30s
  path: /metrics
  metricRelabelings:
    - { sourceLabels: [__name__], action: keep, regex: 'atlantis_.*' }
    # 실행 카운터 이름에 _total 부여 — Prometheus 3 은 _total 없는 지표에 increase() 를 쓰면 "카운터가 아닐 수 있음" 안내(대시보드 ⚠)
    - { sourceLabels: [__name__], action: replace, regex: 'atlantis_(.+_execution_(success|error|failure))', targetLabel: __name__, replacement: 'atlantis_${1}_total' }
podDisruptionBudget:
  enabled: false # 단일 replica + PDB 는 Autopilot 노드 업그레이드를 막음

# Spot 미사용: apply 도중 선점되면 부분 적용·state 잠금이 남음. 켜는 시간만 과금되므로 비용 차이 작음
resources:
  requests: { cpu: 250m, memory: 1Gi, ephemeral-storage: 1Gi } # AWS provider plan 실측 전 여유값
  limits: { memory: 1Gi, ephemeral-storage: 1Gi }
terminationGracePeriodSeconds: 600 # 진행 중 plan/apply 마무리 시간 (20:00 자동 종료 대비, Spot 아님이라 25s 상한 없음)

volumeClaim:
  enabled: true
  dataStorage: 2Gi # 저장소 clone·provider 캐시·잠금 DB
  storageClassName: pd-standard-wffc

serviceAccount:
  create: true
  name: atlantis # AWS 역할 신뢰 조건 sub = system:serviceaccount:atlantis:atlantis
  mount: false # k8s API 불필요. AWS 용 토큰은 아래 projected 볼륨으로 따로

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }

environment:
  AWS_CONFIG_FILE: /etc/aws/config
  GUARD_APPROVERS: windevase # apply 직전 감시가 인정하는 승인자·해제 라벨 부착자 (공백 구분)
  AWS_EC2_METADATA_DISABLED: "true" # GKE 메타데이터 서버를 AWS IMDS 로 오인하지 않게
  TF_IN_AUTOMATION: "true"
environmentSecrets:
  - name: GUARD_GH_TOKEN
    secretKeyRef: { name: atlantis-guard-github, key: token }

extraVolumes:
  - name: aws-token
    projected:
      sources:
        - serviceAccountToken: { audience: sts.amazonaws.com, expirationSeconds: 3600, path: token }
  - name: aws-config
    configMap: { name: atlantis-aws-config }
  - name: guard
    configMap: { name: atlantis-guard, defaultMode: 0555 }
  - name: gcp-platform
    secret: { secretName: atlantis-gcp-platform, optional: true, defaultMode: 0440 } # uid 100 은 fsGroup 1000 으로 읽음
extraVolumeMounts:
  - { name: aws-token, mountPath: /var/run/secrets/aws, readOnly: true }
  - { name: aws-config, mountPath: /etc/aws, readOnly: true }
  - { name: guard, mountPath: /opt/guard, readOnly: true }
  - { name: gcp-platform, mountPath: /etc/gcp-platform, readOnly: true }

# 감시 스크립트용 jq (이미지에 없음) — 체크섬 확인 후 공유 폴더(/plugins, PATH 포함)에 설치
initConfig:
  enabled: true
  image: alpine:3.24.3
  sharedDir: /plugins
  sizeLimit: 20Mi
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
  script: |
    #!/bin/sh
    set -eu
    JQ_VERSION=1.8.1
    JQ_SHA256=020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d
    wget -q "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64" -O "${INIT_SHARED_DIR}/jq"
    echo "${JQ_SHA256}  ${INIT_SHARED_DIR}/jq" | sha256sum -c
    chmod 755 "${INIT_SHARED_DIR}/jq"
