apiVersion: v1
kind: Service
metadata:
  name: lab-api
  namespace: lab-api
  labels:
    app.kubernetes.io/name: lab-api
spec:
  selector:
    app.kubernetes.io/name: lab-api
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 9090, targetPort: metrics }
---
# 지표 수집 — SLO(2단계)·canary 분석(3단계)이 쓰는 지표만 keep
# ※ ServiceMonitor 는 CR → 반영하려면 Prometheus Operator 를 잠깐 켜야 함 (평소 0)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lab-api
  namespace: lab-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-api
  podTargetLabels: # canary 분석이 파드 템플릿(버전)별로 나눠 보도록 → 레이블 rollouts_pod_template_hash
    - rollouts-pod-template-hash
  endpoints:
    - port: metrics
      interval: 30s
      metricRelabelings:
        - sourceLabels: [__name__]
          action: keep
          regex: 'http_requests_total|http_request_duration_seconds_(bucket|sum|count)|lab_api_build_info|process_resident_memory_bytes|go_goroutines'
