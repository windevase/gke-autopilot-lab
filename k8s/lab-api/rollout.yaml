# lab-api: SRE·공급망 실습용 샘플 서비스 (코드 app/lab-api, 이미지 CI .github/workflows/lab-api.yml)
# - 이미지는 **서명된 digest 로만** 지정 (태그 금지). 새 버전 = CI 요약의 digest 로 이 파일을 바꾸는 PR (GitOps)
#   검증: cosign verify --key app/lab-api/cosign.pub --insecure-ignore-tlog <이미지>
# - 24시간 2대(Spot, 노드 분산) — SLO 지표가 끊기지 않게. 비용 50m/64Mi × 2
# - Argo Rollouts canary (3단계, 2026-11-19): 새 파드 템플릿(이미지·환경 변수 변경)이 오면
#   ① canary 1대 추가(50%: stable 2 + canary 1 → 서비스 트래픽 약 1/3) → ② 6분 관찰 → ③ 전체 교체
#   관찰 중 AnalysisTemplate slo-burn-rate 가 canary 파드만의 SLO 소진 속도를 1분마다 조회 →
#   page 기준(14.4배) 이상이면 즉시 중단(abort) → canary 제거, stable 유지 = 자동 롤백. 복구는 Git 되돌리기
#   (트래픽 분할은 서비스 메시 없이 파드 수 비율 — Service 가 stable·canary 파드를 함께 선택)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: lab-api
  namespace: lab-api
  labels:
    app.kubernetes.io/name: lab-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-api
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      terminationGracePeriodSeconds: 25 # Spot 상한. 앱은 readiness 를 먼저 내리고 5s 후 종료(최대 20s)
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Spot 노드 1대 회수에도 한 대는 남도록 노드 분산 (노드가 1대뿐이면 같은 노드 허용)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: lab-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: lab-api
          image: ghcr.io/windevase/lab-api@sha256:146f512ec5793c94cc9f7672a6c0e00e00b9c5d3da303377ea5ff9f7983aca6c # sha-4c5f38e (PR #62 main 빌드)
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          env: [] # 장애 주입: FAULT_ERROR_RATE(0~1), FAULT_LATENCY_MS — canary 실패 시연 때만
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 100Mi }
            limits: { memory: 64Mi }
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      analysis: # 백그라운드 분석: 50% 단계부터 끝날 때까지
        templates:
          - templateName: slo-burn-rate
        startingStep: 1
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 50
        - pause: { duration: 6m }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lab-api
  namespace: lab-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-api
