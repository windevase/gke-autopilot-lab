# CI: 클라우드 자격증명 없이 할 수 있는 정적 검증만 수행 (plan/apply는 로컬에서 tf.ps1로)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform fmt / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.17.1
      # Atlantis plan 첫 단계와 같은 사전 검사(서버 측 사본) — PR 화면에 미리 표시
      # base(main) 버전으로 실행 — PR 이 사전 검사 스크립트를 고쳐 자신을 통과시키지 못하게
      - name: terraform 사전 검사 (base 버전 tf-precheck)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          s="$RUNNER_TEMP/tf-precheck.sh"
          git fetch -q --depth=1 origin "$BASE" 2>/dev/null || true
          git show "$BASE:k8s/atlantis/manifests/guard/tf-precheck.sh" >"$s" 2>/dev/null || cp k8s/atlantis/manifests/guard/tf-precheck.sh "$s"
          bash "$s" "$PWD"
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: init (backend 없이)
        run: terraform init -backend=false -input=false
      - name: validate (bootstrap = 루트)
        run: terraform validate
      - name: validate (platform — Atlantis 대상)
        run: |
          terraform -chdir=platform init -backend=false -input=false
          terraform -chdir=platform validate

  kubernetes:
    name: Kubernetes 매니페스트 검증
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
      CHART_VERSION: 93.3.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: kubeconform 설치
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: 매니페스트 검증 (values.yaml 제외)
        run: |
          find k8s -name '*.yaml' ! -name 'values.yaml' -print0 \
            | xargs -0 kubeconform -strict -summary -ignore-missing-schemas
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.1.4
      - name: Helm 렌더링 + 검증 (kube-prometheus-stack + values.yaml)
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm template kps prometheus-community/kube-prometheus-stack \
            --version "${CHART_VERSION}" -n monitoring -f k8s/monitoring/kps/values.yaml > rendered.yaml
          # CRD(Prometheus, ServiceMonitor 등)는 스키마가 없어 건너뜀
          kubeconform -strict -summary -ignore-missing-schemas rendered.yaml
      - name: Helm 렌더링 + 검증 (Argo CD + k8s/argocd/values.yaml)
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm template argocd argo/argo-cd --version 10.18.0 -n argocd \
            -f k8s/argocd/values.yaml > rendered-argocd.yaml
          kubeconform -strict -summary -ignore-missing-schemas rendered-argocd.yaml
      - name: Helm·kustomize 렌더링 + 검증 (Atlantis)
        run: |
          helm repo add runatlantis https://runatlantis.github.io/helm-charts
          # 차트 버전은 Argo 앱 파일에서 읽는다 — Renovate 가 앱 파일만 올려도 CI 가 새 버전을 검증 (고정값이면 검증이 빠짐)
          ver=$(sed -nE 's/^ *targetRevision: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' k8s/apps/atlantis.yaml | head -1)
          [ -n "$ver" ] || { echo "::error::k8s/apps/atlantis.yaml 에서 차트 버전을 못 읽음"; exit 1; }
          echo "Atlantis 차트 $ver"
          helm template atlantis runatlantis/atlantis --version "$ver" -n atlantis \
            -f k8s/atlantis/values.yaml > rendered-atlantis.yaml
          echo '---' >> rendered-atlantis.yaml
          kubectl kustomize k8s/atlantis/manifests >> rendered-atlantis.yaml
          kubeconform -strict -summary -ignore-missing-schemas rendered-atlantis.yaml
          bash -n k8s/atlantis/manifests/guard/*.sh

  # Kyverno 정책(k8s/kyverno/policies, 클러스터에는 Audit) 을 배포 전에 검사 — 위반이면 실패
  # 대상: 저장소 매니페스트 + 클러스터에 올라가는 Helm 차트 렌더링(차트 버전은 Argo 앱·install.ps1 에서 읽음)
  policy:
    name: Kyverno 정책 검사
    runs-on: ubuntu-latest
    env:
      KYVERNO_VERSION: 1.20.0 # kyverno/kyverno
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.1.4
      - name: Kyverno CLI 설치 (체크섬 확인)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          f="kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/$f"
          curl -fsSLO "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/checksums.txt"
          grep " $f\$" checksums.txt | sha256sum -c -
          tar -xzf "$f" kyverno && install -m 0755 kyverno /usr/local/bin/kyverno 2>/dev/null || sudo install -m 0755 kyverno /usr/local/bin/kyverno
          kyverno version
      - name: Helm 차트 렌더링
        run: |
          set -euo pipefail
          ver() { sed -nE 's/^ *targetRevision: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' "k8s/apps/$1.yaml" | head -1; }
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts >/dev/null
          helm repo add argo https://argoproj.github.io/argo-helm >/dev/null
          helm repo add runatlantis https://runatlantis.github.io/helm-charts >/dev/null
          helm repo add openbao https://openbao.github.io/openbao-helm >/dev/null
          mkdir -p "$RUNNER_TEMP/render" && r="$RUNNER_TEMP/render"
          helm template kps prometheus-community/kube-prometheus-stack --version "$(ver kps)" -n monitoring -f k8s/monitoring/kps/values.yaml > "$r/kps.yaml"
          helm template argocd argo/argo-cd --version "$(sed -nE 's/^\$chartVersion = "([0-9.]+)".*/\1/p' k8s/argocd/install.ps1)" -n argocd -f k8s/argocd/values.yaml > "$r/argocd.yaml"
          helm template atlantis runatlantis/atlantis --version "$(ver atlantis)" -n atlantis -f k8s/atlantis/values.yaml > "$r/atlantis.yaml"
          kubectl kustomize k8s/atlantis/manifests > "$r/atlantis-manifests.yaml"
          helm template openbao openbao/openbao --version "$(ver openbao)" -n openbao -f k8s/openbao/values.yaml > "$r/openbao.yaml"
          helm template argo-rollouts argo/argo-rollouts --version "$(ver argo-rollouts)" -n argo-rollouts -f k8s/argo-rollouts/values.yaml > "$r/argo-rollouts.yaml"
          helm repo add kyverno https://kyverno.github.io/kyverno/ >/dev/null
          helm template kyverno kyverno/kyverno --version "$(ver kyverno)" -n kyverno -f k8s/kyverno/values.yaml > "$r/kyverno.yaml"
          wc -l "$r"/*.yaml
      - name: 정책 적용 (위반·오류 있으면 실패)
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r f; do args+=(--resource "$f"); done < <(find k8s -name '*.yaml' ! -name 'values.yaml' ! -path 'k8s/kyverno/*'; ls "$RUNNER_TEMP"/render/*.yaml)
          # 이미지 서명 정책(verify-*, ImageValidatingPolicy)은 파드 전용 + CLI 가 Argo Application 등 모르는 종류를 매핑하다 실패 → 제외
          # (서명은 lab-api CI 가 빌드 때 검증, 클러스터에서는 Kyverno 가 실제 파드에 대해 보고)
          mapfile -t policies < <(ls k8s/kyverno/policies/*.yaml | grep -v '/verify-')
          kyverno apply "${policies[@]}" "${args[@]}" | tee "$RUNNER_TEMP/kyverno.txt"
          grep -q "fail: 0, warn: 0, error: 0" "$RUNNER_TEMP/kyverno.txt" || { echo "::error::Kyverno 정책 위반 또는 오류"; exit 1; }
          { echo '### Kyverno 정책 검사'; echo '```'; tail -n 1 "$RUNNER_TEMP/kyverno.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # infra-terraform 원본과 사본이 같은지 (다르면 실패 — 원본을 먼저 고치고 merge 한 뒤 사본을 갱신)

  secrets:
    name: 비밀값 스캔 (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.18.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # 전체 커밋 기록 스캔
      - name: gitleaks 설치
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: 스캔
        run: gitleaks detect --source . --redact --verbose

  lint:
    name: 대시보드 JSON / Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: 대시보드 JSON 유효성
        run: |
          for f in k8s/monitoring/dashboards/*.json; do
            python -m json.tool "$f" > /dev/null && echo "ok: $f"
          done
      - name: 대시보드 생성기 결과 = 커밋된 JSON
        run: |
          cd k8s/monitoring/dashboards
          # 생성기:결과 JSON (lab-cost-capacity.json은 수작업 관리라 제외)
          for pair in gen_cluster_dashboard.py:lab-cluster-performance.json \
                      gen_ops_dashboard.py:lab-ops.json \
                      gen_billing_dashboard.py:lab-billing.json \
                      gen_home_dashboard.py:lab-home.json \
                      gen_argocd_dashboard.py:lab-argocd.json \
                      gen_github_dashboard.py:lab-github.json \
                      gen_github_usage_dashboard.py:lab-github-usage.json \
                      gen_openbao_dashboard.py:lab-openbao.json \
                      gen_slo_dashboard.py:lab-slo.json \
                      gen_kyverno_dashboard.py:lab-kyverno.json; do
            gen="${pair%%:*}"; json="${pair##*:}"
            python "$gen" "/tmp/$json"
            diff <(python -m json.tool --sort-keys "/tmp/$json") <(python -m json.tool --sort-keys "$json")
            echo "ok: $gen = $json"
          done
      - name: 대시보드 ConfigMap = JSON
        run: |
          pip install --quiet pyyaml
          cd k8s/monitoring/dashboards
          python - <<'EOF'
          import glob, json, yaml
          for cm_file in sorted(glob.glob("*.configmap.yaml")):
              cm = yaml.safe_load(open(cm_file, encoding="utf-8"))
              for name, body in cm["data"].items():
                  assert json.loads(body) == json.load(open(name, encoding="utf-8")), f"{cm_file}: {name} 불일치 (ConfigMap 재생성 필요)"
              print("ok:", cm_file)
          EOF
      - name: SLO 원본 = 생성된 PrometheusRule (Sloth)
        env:
          SLOTH_VERSION: 0.16.0 # slok/sloth
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/slok/sloth/releases/download/v${SLOTH_VERSION}/sloth-linux-amd64"
          curl -fsSLO "https://github.com/slok/sloth/releases/download/v${SLOTH_VERSION}/checksums.txt"
          grep " sloth-linux-amd64\$" checksums.txt | sha256sum -c -
          install -m 0755 sloth-linux-amd64 sloth
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/sloth" generate -i slo/lab-api.yaml -o "$RUNNER_TEMP/slo-rules.yaml" \
            --slo-period-windows-path=slo/windows --default-slo-period=7d --no-log
          diff "$RUNNER_TEMP/slo-rules.yaml" k8s/lab-api/slo-rules.yaml && echo "ok: slo/lab-api.yaml = k8s/lab-api/slo-rules.yaml"
      - name: budget-guard 스크립트 문법
        run: |
          pip install --quiet pyyaml
          python - <<'EOF'
          import yaml
          docs = list(yaml.safe_load_all(open("k8s/monitoring/budget-guard/budget-guard.yaml", encoding="utf-8")))
          src = next(d for d in docs if d and d.get("kind") == "ConfigMap")["data"]["guard.py"]
          compile(src, "guard.py", "exec")
          print("ok: budget-guard guard.py")
          EOF
